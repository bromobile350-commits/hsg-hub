<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSG 总管理</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--accent:#2563eb}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#181b21;--text:#e8eaee;--muted:#9aa1ad;--line:#272b33;--accent:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;padding:16px 16px 32px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.totals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;margin-bottom:14px}
.t{text-align:center}.t b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.t span{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-weight:600;font-size:16px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.ok{background:var(--ok)}.ext_down{background:var(--warn)}.offline{background:var(--bad)}
.meta{color:var(--muted);font-size:12px;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.grid div{background:var(--bg);border-radius:10px;padding:6px 4px;text-align:center}
.grid b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.grid span{font-size:11px;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:4px;height:46px;margin:4px 0 2px}
.bar{flex:1;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;min-height:2px}
.days{display:flex;gap:4px;font-size:10px;color:var(--muted)}.days span{flex:1;text-align:center}
.book{font-size:12px;color:var(--muted);margin-top:8px}
.msg{color:var(--muted);text-align:center;padding:40px 0}
button{width:100%;padding:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;margin-top:4px}
.tabs{display:flex;gap:6px;margin:0 0 12px}.tabs a{flex:1;text-align:center;padding:8px 2px;white-space:nowrap;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:12.5px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:13px;margin-top:8px}.kv span{color:var(--muted)}.kv div{min-width:0;word-break:break-word}
.tabs a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
select,input[type=date]{width:100%;min-width:0;box-sizing:border-box;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;margin-bottom:8px}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:var(--text);text-decoration:none}
.item .l1{display:flex;justify-content:space-between;gap:8px;font-weight:600}.item .l2{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:500}.th{background:#fde68a;color:#78350f}.tb{background:#bbf7d0;color:#14532d}
.msgs{display:flex;flex-direction:column;gap:6px}.b{max-width:82%;padding:8px 10px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.b small{display:block;font-size:10px;opacity:.65;margin-top:2px}
.buyer{align-self:flex-start;background:var(--card);border:1px solid var(--line)}.bot{align-self:flex-end;background:var(--accent);color:#fff}
.boss{align-self:flex-end;background:#7c3aed;color:#fff}.holding{align-self:flex-end;background:#64748b;color:#fff}
.note{align-self:center;font-size:12px;color:var(--muted);background:transparent;text-align:center;max-width:95%}
.unit{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.unit img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg)}
.unit .u{flex:1;min-width:0}.unit .u b{font-size:14px}.unit .p{color:var(--accent);font-weight:700}
.unit button{width:auto;padding:6px 10px;font-size:13px;margin-top:6px}.unit button:disabled{opacity:.5}
.tq{background:#dbeafe;color:#1e3a8a}.te{background:#e5e7eb;color:#374151}
.mt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}.mt th{font-size:11px;color:var(--muted);font-weight:500;text-align:right;padding:4px 3px;border-bottom:1px solid var(--line)}.mt td{text-align:right;padding:6px 3px;border-bottom:1px solid var(--line);white-space:nowrap}.mt th:first-child,.mt td.mq{text-align:left}.mt td.mm{color:var(--muted)}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<h1>HSG 总管理</h1>
<div class="tabs"><a href="#" id="t1" class="on">总览</a><a href="#" id="t2">聊天记录</a><a href="#" id="t3">待上架</a><a href="#" id="t4">市场价</a><a href="#" id="t5">设备</a><a href="#" id="t6">用量</a></div>
<div class="sub" id="sub">载入中…</div>
<div id="root"></div>
<button id="refresh">刷新</button>
<script>
const API = (location.hostname.endsWith('github.io') ? 'https://clock-support-ladle.ngrok-free.dev/' : '');   // page on GitHub Pages, data from the hub
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = s => s < 90 ? '刚刚' : s < 3600 ? Math.round(s/60) + ' 分钟前' : s < 86400 ? Math.round(s/3600) + ' 小时前' : Math.round(s/86400) + ' 天前';
const STATUS = {ok:'在线', ext_down:'扩展停了', offline:'离线'};
async function load(){
  const sub = document.getElementById('sub'), root = document.getElementById('root');
  try{
    const r = await fetch(API + 'api/overview', {headers:H(), cache:'no-store'});
    if (r.status === 403){ root.innerHTML = '<div class="msg">请在 Telegram 里从 bot 菜单打开</div>'; sub.textContent=''; return; }
    const d = await r.json();
    const t = d.total;
    sub.textContent = `今天 ${d.today.slice(5)} · ${d.stations.length} 台电脑 · 更新于 ${new Date().toLocaleTimeString('zh',{hour:'2-digit',minute:'2-digit'})}`;
    let h = mode !== 'overview' ? '' : `<div class="totals">
      <div class="t"><b>${t.asked}</b><span>询问</span></div><div class="t"><b>${t.new}</b><span>新买家</span></div>
      <div class="t"><b>${t.sent}</b><span>回复</span></div><div class="t"><b>${t.bookings}</b><span>预约</span></div>
      <div class="t"><b>${t.human}</b><span>转人工</span></div></div>`;
    const fx = d.usd_myr || 4.1, rm = u => 'RM' + (u * fx).toFixed(2), ktok = n => n >= 1e6 ? (n/1e6).toFixed(2) + 'M' : n >= 1e3 ? Math.round(n/1e3) + 'K' : String(n);
    const uw = d.usage_week || [], ut = uw.length ? uw[uw.length-1] : {usd:0,tokens:0}, u7 = uw.reduce((a,x) => a + x.usd, 0);
    const umax = Math.max(0.0001, ...uw.map(x => x.usd));
    if (mode === 'usage') h += `<div class="card"><div class="row"><span class="name">AI 用量(全部电脑)</span><span class="meta" style="margin:0">1 USD = RM${fx.toFixed(2)}</span></div>
      <select id="umon" style="margin-top:8px"></select>
      <div style="display:flex;gap:8px;align-items:center"><input type="date" id="ufrom"><span class="meta" style="margin:0 0 8px">到</span><input type="date" id="uto"></div>
      <div id="uday_box"></div>
      <div class="meta" style="margin:6px 0 0">按 API 官方价估算(GPT-6 Astra 输入 $10 / 输出 $50,Claude Opus 5.5 输入 $4 / 输出 $20,每百万 tokens)。用 Claude / ChatGPT 订阅登录的不按 token 收费,这里是“如果用 API 要付多少”。第 24 版之前的调用没有 token 记录,按每次约 1.4 万 tokens 估算。</div></div>`;
    if (!d.stations.length) h += '<div class="msg">还没有电脑上报</div>';
    const short = m => String(m || '').replace(/^.*\//, '').replace(/@.*$/, '');
    const nice = m => { const r = /^remote:/.test(m), n = short(String(m).replace(/^remote:/, ''));
      return (/claude/.test(n) ? 'Claude ' + n.replace(/^claude-/, '').replace(/-/g, ' ') : /gpt/.test(n) ? 'GPT ' + n.replace(/^gpt-/, '') : n) + (r ? '(主台 weiyi)' : '(本机)'); };
    if (mode === 'devices') sub.textContent = '模型和各台电脑的设定';
    if (mode === 'usage') sub.textContent = 'AI 用量和费用(按 API 价估算)';
    if (mode === 'devices' && d.main_ai){
      const ma = d.main_ai, ms = d.stations.find(x => x.station === ma.station) || {}, mh = ms.health || {}, ac = mh.accounts || {}, dv = mh.device || {};
      let nC = 0, nG = 0, nL = 0, nE = 0;
      for (const x of d.stations){ const t = (x.health || {}).ai_today || {};
        for (const [m, n] of Object.entries(t.models || {})){ if (/^remote:.*claude/.test(m)) nC += n; else if (/^remote:/.test(m)) nG += n; else nL += n; }
        nE += t.errors || 0; }
      const st = ma.stats || {}, nm = x => 'Claude ' + String(x).replace(/^claude-/, '').replace(/(\d)-(\d)/, '$1.$2').replace(/-/g, ' ').replace(/\b[a-z]/, c => c.toUpperCase());
      const onMain = d.stations.filter(x => x.ai_primary === 'main').length;
      const errAge = st.last_error_ts ? Math.round(d.now - st.last_error_ts) : null;
      h += `<div class="card" style="border:1.5px solid var(--accent)"><div class="row"><span class="name">主台 AI</span><span class="pill ${ms.status || 'offline'}">${STATUS[ms.status] || '离线'}</span></div>
        <div class="meta" style="margin:2px 0 8px">全部电脑共用 · ${esc(ms.label || 'weiyi')}</div>
        <div class="kv" style="grid-template-columns:52px 1fr;align-items:center">
          <span>模型</span><div><select id="mainmodel" style="margin:0">${(ma.options || []).map(o => `<option value="${esc(o)}" ${o === ma.model ? 'selected' : ''}>${esc(nm(o))}</option>`).join('')}</select></div>
          <span>兜底</span><div>GPT ${esc(String(ma.backup || '').replace(/^gpt-/, ''))}</div>
          <span>账户</span><div>${esc(ac.claude || '读不到')}</div>
          <span>今天</span><div>Claude <b>${nC}</b> 次 · GPT 兜底 <b>${nG}</b> 次${nE ? ' · <span style="color:var(--bad)">出错 ' + nE + '</span>' : ''}</div>
        </div></div>
        <div class="card" style="padding-bottom:4px"><div class="row"><span class="name">各台电脑</span><span class="meta" style="margin:0">${onMain}/${d.stations.length} 台用主台</span></div>`;
    }
    for (const s of d.stations){
      const td = s.today || {}, hl = s.health || {};
      const head = `<div class="row"><span class="name">${esc(s.label)}</span><span class="pill ${s.status}">${STATUS[s.status]}</span></div>`;
      if (mode === 'devices'){
        const ao = hl.ai_order || {};
        const plug = hl.last_inbox_age_s == null || hl.last_inbox_age_s > 900;
        const state = s.status === 'offline' ? '<span style="color:var(--bad)">离线 · ' + ago(s.last_seen_s) + '</span>'
          : plug ? '<span style="color:var(--bad)">插件没连上,不会回买家</span>' : '正常 · 今天回 ' + ((s.today || {}).sent ?? 0) + ' 条';
        h += `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)">
          <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(s.label)}</div>
            <div style="font-size:12px;color:var(--muted)">${state}${ao.primary && ao.primary !== s.ai_primary ? ' · 已改,5 分钟内生效' : ''}</div></div>
          <select class="sw" data-st="${esc(s.station)}" data-cur="${esc(s.ai_primary)}" style="width:118px;margin:0;padding:7px;font-size:13px">
            <option value="main" ${s.ai_primary === 'main' ? 'selected' : ''}>主台</option><option value="gpt" ${s.ai_primary === 'gpt' ? 'selected' : ''}>本机 GPT</option><option value="claude" ${s.ai_primary === 'claude' ? 'selected' : ''}>本机 Claude</option></select></div>`;
        if (s === d.stations[d.stations.length - 1]) h += '</div>';
        continue;
      }
      if (mode === 'usage'){
        const u = s.usage_today;
        const per = u ? Object.entries(u.models || {}).map(([m, x]) => `${esc(m)} ${x.calls} 次 ${ktok(x.in + x.out + x.cache_read + x.cache_write)}`).join('<br>') : '';
        h += `<div class="card">${head}<div class="kv">
          <span>今天</span><div>${u && (u.in + u.out) ? ktok(u.in + u.out + u.cache_read + u.cache_write) + ' tokens ≈ <b>' + rm(u.usd) + '</b>' : '没有用量'}</div>
          <span>7 天</span><div><b>${rm(s.usage_7d_usd || 0)}</b></div>
          <span>模型</span><div>${per || '-'}</div></div></div>`;
        continue;
      }
      const max = Math.max(1, ...s.week.map(w => w.asked)), L = hl.listings || {};
      h += `<div class="card">${head}
        <div class="meta">${L.total != null ? `帖子:在售 ${L.active} · 已售 ${L.sold} · 今天新上 ${L.new_today} · 点击 ${L.clicks}` : L.day ? `帖子:挂着 ${L.active}` : '帖子:还没读到'}${hl.waiting_for_boss ? ' · 等你回 ' + hl.waiting_for_boss : ''}</div>
        <div class="grid">
          <div><b>${td.asked ?? 0}</b><span>询问</span></div><div><b>${td.sent ?? 0}</b><span>回复</span></div>
          <div><b>${(td.bookings || []).length}</b><span>预约</span></div><div><b>${td.human ?? 0}</b><span>转人工</span></div></div>
        <div class="week">${s.week.map(w => `<div class="bar" title="${w.day} 询问 ${w.asked}" style="height:${Math.round(w.asked / max * 100)}%"></div>`).join('')}</div>
        <div class="days">${s.week.map(w => `<span>${w.day.slice(8)}</span>`).join('')}</div>
        ${(td.bookings || []).length ? `<div class="book">预约:${td.bookings.map(esc).join('<br>')}</div>` : ''}
      </div>`;
    }
    root.innerHTML = h;
    const mmSel = document.getElementById('mainmodel');
    if (mmSel) mmSel.onchange = () => { const v = mmSel.value, txt = mmSel.options[mmSel.selectedIndex].text;
      const go = async () => { try { await fetch(API + 'api/main_model', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, H()), body: JSON.stringify({model: v})}); } catch(e){} load(); };
      const q = '全部电脑改用 ' + txt + '?下一条回复马上生效';
      if (tg && tg.showConfirm) tg.showConfirm(q, ok => ok ? go() : load()); else if (confirm(q)) go(); else load(); };
    root.querySelectorAll('select.sw').forEach(sl => sl.onchange = () => {
      const name = {main: '主台(Claude,GPT 兜底)', gpt: '本机 GPT', claude: '本机 Claude'}[sl.value];
      const go = async () => { sl.disabled = true;
        try { await fetch(API + 'api/ai_primary', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, H()), body: JSON.stringify({station: sl.dataset.st, primary: sl.value})}); } catch(e){}
        load(); };
      const q = '这台改成用 ' + name + '?';
      if (tg && tg.showConfirm) tg.showConfirm(q, ok => ok ? go() : (sl.value = sl.dataset.cur)); else if (confirm(q)) go(); else sl.value = sl.dataset.cur;
    });
    if (document.getElementById('umon')) setupUsage(d.today);
  }catch(e){ root.innerHTML = '<div class="msg">连不上中枢(电脑关了或断网?)</div>'; sub.textContent=''; }
}
function setupUsage(today){
  const mon = document.getElementById('umon'), f = document.getElementById('ufrom'), t = document.getElementById('uto');
  const D = x => new Date(x + 'T00:00:00Z'), add = (x, n) => ymd(new Date(D(x).getTime() + n*86400e3));
  const opts = [['today','今天 ' + today.slice(5), today, today], ['yest','昨天 ' + add(today,-1).slice(5), add(today,-1), add(today,-1)], ['7d','最近 7 天', add(today,-6), today]];
  let y = +today.slice(0,4), m = +today.slice(5,7);
  for (let i = 0; i < 12; i++){
    const mm = String(m).padStart(2,'0'), last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const end = i === 0 ? today : `${y}-${mm}-${String(last).padStart(2,'0')}`;
    opts.push([`m${y}${mm}`, `${y} 年 ${m} 月${i===0?'(本月)':i===1?'(上个月)':''}`, `${y}-${mm}-01`, end]);
    if (--m < 1){ m = 12; y--; }
  }
  mon.innerHTML = opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('') + '<option value="custom">自己选日期</option>';
  f.max = t.max = today;
  const st = window._urange || {key: opts[3][0], from: opts[3][2], to: opts[3][3]};
  const apply = () => { window._urange = st; mon.value = st.key; f.value = st.from; t.value = st.to; loadUsageRange(st.from, st.to); };
  mon.onchange = () => { const o = opts.find(x => x[0] === mon.value); if (o){ st.key = o[0]; st.from = o[2]; st.to = o[3]; apply(); } };
  const custom = () => { if (!f.value || !t.value) return; st.key = 'custom'; st.from = f.value <= t.value ? f.value : t.value; st.to = f.value <= t.value ? t.value : f.value; apply(); };
  f.onchange = custom; t.onchange = custom;
  apply();
}
async function loadUsageRange(from, to){
  const box = document.getElementById('uday_box'); if (!box) return;
  try{
    const d = await (await fetch(API + 'api/usage?from=' + from + '&to=' + to, {headers:H(), cache:'no-store'})).json();
    const fx = d.usd_myr || 4.1, rm = u => 'RM' + (u * fx).toFixed(2), kt = n => n >= 1e6 ? (n/1e6).toFixed(2) + 'M' : n >= 1e3 ? Math.round(n/1e3) + 'K' : String(n);
    const title = `<div class="meta" style="margin:2px 0 0">${from === to ? from : from + ' 到 ' + to}${d.first_day && from < d.first_day ? ' · 记录从 ' + d.first_day + ' 开始' : ''}</div>`;
    if (!d.stations.length){ box.innerHTML = title + '<div class="meta" style="margin:6px 0">这段时间没有记录</div>'; return; }
    const mx = Math.max(0.0001, ...d.days.map(x => x.usd)), n = d.days.length, step = n > 16 ? 5 : n > 8 ? 2 : 1;
    box.innerHTML = title + `<div class="grid" style="grid-template-columns:repeat(3,1fr);margin:8px 0 4px"><div><b>${kt(d.total.tokens)}</b><span>tokens</span></div><div><b>${d.total.calls}</b><span>次调用</span></div><div><b>${rm(d.total.usd)}</b><span>费用</span></div></div>` +
      (n > 1 ? `<div class="meta" style="margin:2px 0">有记录 ${n} 天 · 平均每天 <b>${rm(d.total.usd / n)}</b></div>
        <div class="week">${d.days.map(x => `<div class="bar" title="${x.day} ${rm(x.usd)}" style="height:${Math.round(x.usd / mx * 100)}%"></div>`).join('')}</div>
        <div class="days">${d.days.map((x, i) => `<span>${i % step === 0 || i === n-1 && step === 1 ? x.day.slice(8) : ''}</span>`).join('')}</div>` : '') +
      '<div class="meta" style="margin:8px 0 2px"><b>每台电脑</b></div>' +
      d.stations.map(r => `<div class="meta" style="margin:2px 0">${esc(r.label)}:${r.calls} 次 · ${kt(r.tokens)} tokens · <b>${rm(r.usd)}</b>${r.estimated_calls ? '(' + r.estimated_calls + ' 次估算)' : ''} · ${Object.entries(r.models).map(([m,x]) => esc(m) + ' ' + rm(x.usd)).join(' / ')}</div>`).join('') +
      (n > 1 ? '<div class="meta" style="margin:8px 0 2px"><b>每天</b></div>' + d.days.slice().reverse().map(x => `<div class="meta" style="margin:2px 0">${x.day.slice(5)}:${x.calls} 次 · ${kt(x.tokens)} tokens · <b>${rm(x.usd)}</b></div>`).join('') : '');
  }catch(e){ box.innerHTML = '<div class="meta">读不到</div>'; }
}
let mode = 'overview';
let view = 'overview', stations = [], selSt = '', selDay = '';
const H = () => ({'X-TG-Init-Data': tg ? tg.initData : '', 'ngrok-skip-browser-warning': '1'});
const ymd = d => d.toISOString().slice(0, 10);
const days = () => { const out = []; const now = new Date(Date.now() + 8*3600e3); for (let i = 0; i < 7; i++){ out.push(ymd(new Date(now - i*86400e3))); } return out; };
async function loadChats(){
  view = 'chats';
  const sub = document.getElementById('sub'), root = document.getElementById('root');
  if (!stations.length){ try{ const r = await fetch(API + 'api/overview', {headers:H()}); stations = (await r.json()).stations || []; }catch(e){} }
  selSt = selSt || (stations[0] || {}).station || ''; selDay = selDay || days()[0];
  let h = `<select id="st">${stations.map(s => `<option value="${esc(s.station)}" ${s.station===selSt?'selected':''}>${esc(s.label)}</option>`).join('')}</select>
           <select id="dy">${days().map((d,i) => `<option value="${d}" ${d===selDay?'selected':''}>${d.slice(5)}${i===0?' 今天':i===1?' 昨天':''}</option>`).join('')}</select><div id="list"><div class="msg">载入中…</div></div>`;
  root.innerHTML = h; sub.textContent = '每台电脑每小时交一次当天的对话';
  document.getElementById('st').onchange = e => { selSt = e.target.value; loadChats(); };
  document.getElementById('dy').onchange = e => { selDay = e.target.value; loadChats(); };
  try{
    const r = await fetch(API + `api/chats?station=${encodeURIComponent(selSt)}&day=${selDay}`, {headers:H()});
    const d = await r.json();
    const list = document.getElementById('list');
    if (!d.chats || !d.chats.length){ list.innerHTML = '<div class="msg">这天还没有交上来的对话</div>'; return; }
    list.innerHTML = `<div class="sub">${d.chats.length} 个买家${d.uploaded_at ? ' · 交上来 ' + new Date(d.uploaded_at*1000).toLocaleTimeString('zh',{hour:'2-digit',minute:'2-digit'}) : ''}</div>` +
      d.chats.map(c => `<a class="item" href="#" data-tid="${esc(c.tid)}"><div class="l1"><span>${esc(c.buyer)}${c.human?'<span class="tag th">转人工</span>':''}${c.booking?'<span class="tag tb">预约</span>':''}</span><span style="color:var(--muted);font-weight:400;font-size:12px">${esc(c.last.slice(11,16))}</span></div><div class="l2">${esc(c.listing)}${c.listing?' · ':''}${esc(c.last_text)}</div></a>`).join('');
    list.querySelectorAll('.item').forEach(a => a.onclick = ev => { ev.preventDefault(); loadChat(a.dataset.tid); });
  }catch(e){ document.getElementById('list').innerHTML = '<div class="msg">连不上中枢</div>'; }
}
async function loadChat(tid){
  view = 'chat';
  const root = document.getElementById('root'), sub = document.getElementById('sub');
  root.innerHTML = '<div class="msg">载入中…</div>';
  const r = await fetch(API + `api/chat?station=${encodeURIComponent(selSt)}&day=${selDay}&tid=${encodeURIComponent(tid)}`, {headers:H()});
  const d = await r.json();
  const NOTE = {note_human:'🙋 转给 Boss:', note_booking:'📅 预约:', note_filtered:'🚫 被拦:', note_fail:'❌ 发送失败:', note_skip:'(不用回)'};
  const WHO = {bot:'机器', boss:'Boss 转发', holding:'机器(请稍等)'};
  sub.textContent = (d.listing || '');
  root.innerHTML = `<a href="#" class="back" id="bk">‹ 返回列表</a><div class="name" style="margin-bottom:8px">${esc(d.buyer)}</div><div class="msgs">` +
    d.timeline.map(x => x.who.startsWith('note') ? `<div class="b note">${NOTE[x.who]||''} ${esc(x.text)} · ${x.t}</div>`
      : `<div class="b ${x.who}">${esc(x.text)}<small>${x.who==='buyer'?'':WHO[x.who]+' · '}${x.t}</small></div>`).join('') + '</div>';
  document.getElementById('bk').onclick = e => { e.preventDefault(); loadChats(); };
  window.scrollTo(0, document.body.scrollHeight);
}

let selOut = '', selSet = '';
async function loadToList(){
  view = 'tolist';
  const sub = document.getElementById('sub'), root = document.getElementById('root');
  if (!stations.length){ try{ const r = await fetch(API + 'api/overview', {headers:H()}); stations = (await r.json()).stations || []; }catch(e){} }
  selSt = selSt || (stations[0] || {}).station || '';
  root.innerHTML = `<select id="st">${stations.map(s => `<option value="${esc(s.station)}" ${s.station===selSt?'selected':''}>${esc(s.label)}</option>`).join('')}</select>
    <select id="ou"><option value="">KL + JB</option><option value="KL" ${selOut==='KL'?'selected':''}>只看 KL</option><option value="JB" ${selOut==='JB'?'selected':''}>只看 JB</option></select>
    <select id="sg"><option value="">全部 set</option><option value="zp" ${selSet==='zp'?'selected':''}>ZP 组(ZP / MY / X)</option><option value="llch" ${selSet==='llch'?'selected':''}>LL / CH 组</option></select><div id="list"><div class="msg">载入中…</div></div>`;
  sub.textContent = '有货、没毛病、这台还没发帖的机';
  document.getElementById('st').onchange = e => { selSt = e.target.value; loadToList(); };
  document.getElementById('ou').onchange = e => { selOut = e.target.value; loadToList(); };
  document.getElementById('sg').onchange = e => { selSet = e.target.value; loadToList(); };
  try{
    const r = await fetch(API + `api/tolist?station=${encodeURIComponent(selSt)}`, {headers:H(), cache:'no-store'});
    const d = await r.json();
    const grp = u => { const st = String(u.set || '').toUpperCase(); return ['ZP','MY','X'].includes(st) ? 'zp' : ['LL','CH'].includes(st) ? 'llch' : ''; };
    const items = (d.items || []).filter(u => (!selOut || u.outlet === selOut) && (!selSet || grp(u) === selSet));
    const list = document.getElementById('list');
    if (!items.length){ list.innerHTML = '<div class="msg">没有待上架的机</div>'; return; }
    const JOB = {queued:'已准备,等电脑打开', opened:'已填好,等员工按发布', posted:'已发布', failed:'填表失败', closed:'窗口被关了', expired:'20 分钟没发,已关'};
    list.innerHTML = `<div class="sub">${items.length} 台 · 这台已在售 ${d.n_posted} 个帖</div>` + items.map(u => `<div class="unit">
      <img loading="lazy" src="${esc(u.img)}"><div class="u"><b>${esc(u.title)}</b>${u.elsewhere?'<span class="tag te">别台有发</span>':''}${u.job?`<span class="tag tq">${JOB[u.job]||esc(u.job)}</span>`:''}
      <div class="meta" style="margin:2px 0 0">${u.battery?'电池 '+u.battery+'% · ':''}${u.set?esc(u.set)+' set · ':''}${esc(u.outlet)}${u.division==='lelongfon'?' · 清货':''}</div>
      <div class="row"><span class="p">RM${u.price.toLocaleString()}</span><button data-id="${u.id}">${u.job?'重新准备':'上架这台'}</button></div></div></div>`).join('');
    list.querySelectorAll('button[data-id]').forEach(b => b.onclick = async () => {
      b.disabled = true; b.textContent = '准备照片和影片…';
      try{
        const r = await fetch(API + 'api/tolist/queue', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, H()), body: JSON.stringify({station: selSt, unit_id: +b.dataset.id})});
        const x = await r.json();
        b.textContent = x.ok ? '✅ 已准备,电脑会打开发帖页' : '❌ ' + (x.error || '失败').slice(0, 40);
      }catch(e){ b.textContent = '❌ 连不上中枢'; b.disabled = false; }
    });
  }catch(e){ document.getElementById('list').innerHTML = '<div class="msg">连不上中枢</div>'; }
}
const tab = n => ['t1','t2','t3','t4','t5','t6'].forEach((t,i) => document.getElementById(t).className = (i+1===n ? 'on' : ''));

async function loadMarket(day){
  view = 'market';
  const sub = document.getElementById('sub'), root = document.getElementById('root');
  root.innerHTML = '<div class="msg">载入中…</div>';
  try{
    const d = await (await fetch(API + 'api/market' + (day ? '?day=' + day : ''), {headers:H(), cache:'no-store'})).json();
    if (!d.rows || !d.rows.length){ root.innerHTML = '<div class="msg">还没有市场价资料</div>'; sub.textContent=''; return; }
    sub.textContent = `FB 市场开价(${esc(d.label)} 的地区)· 只比 ZP set`;
    const rm = v => v == null ? '-' : 'RM' + Number(v).toLocaleString();
    const diff = (o, m) => { if (!o || m == null) return '<span class="meta">没货</span>'; const x = o[0] - m;
      const col = x < -50 ? 'var(--ok)' : x > 50 ? 'var(--bad)' : 'var(--muted)';
      return `${rm(o[0])} <small class="meta">${esc(o[1])}</small> <b style="color:${col}">${x > 0 ? '+' : ''}${x}</b>`; };
    let h = `<select id="mday">${(d.days||[]).map(x => `<option value="${x}" ${x===d.day?'selected':''}>${x.slice(5)}</option>`).join('')}</select>`;
    const short = q => esc(q.replace(/^iPhone\s*/i, '').replace(/\s*GB$/i, '').replace(/ Pro Max/i, ' PM'));
    const cell = (o, m) => { if (!o || m == null) return '<td class="mm">–</td><td></td>'; const x = o[0] - m;
      const col = x < -50 ? 'var(--ok)' : x > 50 ? 'var(--bad)' : 'var(--muted)';
      return `<td>${Number(o[0]).toLocaleString()}</td><td style="color:${col};font-weight:600">${x > 0 ? '+' : ''}${x}</td>`; };
    // Boss 11-01: only the ZP set — our cheapest ZP/MY unit (no defects) vs the market's used price
    h += `<div class="card" style="padding:8px 6px;overflow-x:auto"><table class="mt"><thead><tr><th>型号</th><th>卖家</th><th>市场价</th><th>我们 ZP</th><th>差</th></tr></thead><tbody>` +
      d.rows.map(r => { const ref = r.median_7d != null ? r.median_7d : r.median, o = r.ours_zp_unit;
        let ours = '<td class="mm">没货</td><td></td>';
        if (o && ref != null) { const x = o[0] - ref, col = x < -50 ? 'var(--ok)' : x > 50 ? 'var(--bad)' : 'var(--muted)';
          ours = `<td>${Number(o[0]).toLocaleString()} <span class="mm" style="font-size:10px">${esc(o[1])}</span></td><td style="color:${col};font-weight:600">${x > 0 ? '+' : ''}${x}</td>`; }
        return `<tr><td class="mq">${short(r.query)}</td><td class="mm">${r.n}</td><td><b>${ref == null ? '–' : Number(ref).toLocaleString()}</b></td>${ours}</tr>`; }).join('') +
      `</tbody></table></div>`;
    const c = d.ctl || {};
    h += `<div class="card"><div class="row"><span class="name" style="font-size:15px">搜寻开关</span><span class="meta" style="margin:0">${c.pending ? (c.pending_kind === 'detail' ? '⏳ 正在读帖子的 set…' : '⏳ 已排队,几分钟内开始') : '空闲'}</span></div>
      <div class="row" style="margin-top:8px;gap:8px"><button id="mrun" style="margin:0" ${c.pending ? 'disabled' : ''}>▶ 现在搜一次</button>
      <button id="mauto" style="margin:0;background:${c.auto ? 'var(--ok)' : '#64748b'}">每天 ${esc(c.at || '10:00')} 自动:${c.auto ? '开' : '关'}</button></div>
      </div>`;
    h += '<div class="meta">单位 RM。市场价 = FB 上同型号同容量的二手开价(去掉最高最低,最近 7 天平均掉乱跳);我们 ZP = 库存里最便宜、没问题的 ZP/MY 机。差:绿 = 我们便宜,红 = 我们贵。市场价是别人的开价(电池/成色不一),不是成交价;没写 set 的帖大多是 ZP/MY。</div>';
    root.innerHTML = h;
    document.getElementById('mday').onchange = e => loadMarket(e.target.value);
    const post = (u, b) => fetch(API + u, {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, H()), body: JSON.stringify(b||{})}).then(r => r.json());
    const mr = document.getElementById('mrun'); if (mr) mr.onclick = async () => { mr.disabled = true; mr.textContent = '已排队…'; await post('api/market/start'); setTimeout(() => loadMarket(day), 1500); };
    const ma = document.getElementById('mauto'); if (ma) ma.onclick = async () => { await post('api/market/auto', {on: !c.auto}); loadMarket(day); };
  }catch(e){ root.innerHTML = '<div class="msg">连不上中枢</div>'; }
}
document.getElementById('t4').onclick = e => { e.preventDefault(); tab(4); loadMarket(); };
document.getElementById('t3').onclick = e => { e.preventDefault(); tab(3); loadToList(); };
document.getElementById('t1').onclick = e => { e.preventDefault(); tab(1); view='overview'; mode='overview'; load(); };
document.getElementById('t5').onclick = e => { e.preventDefault(); tab(5); view='overview'; mode='devices'; load(); };
document.getElementById('t6').onclick = e => { e.preventDefault(); tab(6); view='overview'; mode='usage'; load(); };
document.getElementById('t2').onclick = e => { e.preventDefault(); tab(2); loadChats(); };
document.getElementById('refresh').onclick = () => view === 'overview' ? load() : view === 'chats' ? loadChats() : view === 'tolist' ? loadToList() : view === 'market' ? loadMarket() : null;
if (location.hash === '#devices'){ mode = 'devices'; tab(5); } else if (location.hash === '#usage'){ mode = 'usage'; tab(6); }
load(); setInterval(() => { if (view === 'overview') load(); }, 60000);
</script>
